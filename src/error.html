<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Worldcraft // Connection Failure</title>
  <style>
    :root {
      --bg-dark: #050805;
      --bg-panel: rgba(10, 16, 12, 0.92);
      --neon-red: #ff2244;
      --neon-red-glow: rgba(255, 34, 68, 0.45);
      --neon-orange: #ff8800;
      --neon-orange-glow: rgba(255, 136, 0, 0.45);
      --neon-green: #00ff66;
      --neon-green-glow: rgba(0, 255, 102, 0.4);
      --text-main: #f0fdf0;
      --text-muted: #62826a;
      --border-color: rgba(255, 34, 68, 0.35);
      --font-mono: 'Consolas', 'Courier New', monospace;
      --font-sans: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 35%, rgba(255, 34, 68, 0.08) 0%, transparent 65%),
        linear-gradient(rgba(0, 255, 102, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* CRT Scanline Overlay */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      z-index: 10;
      opacity: 0.8;
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      z-index: 11;
    }

    /* Main HUD Container */
    .cyber-hud-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      box-shadow: 
        0 0 30px rgba(255, 34, 68, 0.15),
        inset 0 0 20px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 620px;
      padding: 36px 32px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    /* Chamfered Cyber Corners */
    .cyber-hud-card::before,
    .cyber-hud-card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }

    .cyber-hud-card::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--neon-red);
      border-left: 2px solid var(--neon-red);
    }

    .cyber-hud-card::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid var(--neon-red);
      border-right: 2px solid var(--neon-red);
    }

    .corner-tr {
      position: absolute;
      top: -1px;
      right: -1px;
      width: 16px;
      height: 16px;
      border-top: 2px solid var(--neon-red);
      border-right: 2px solid var(--neon-red);
      pointer-events: none;
    }

    .corner-bl {
      position: absolute;
      bottom: -1px;
      left: -1px;
      width: 16px;
      height: 16px;
      border-bottom: 2px solid var(--neon-red);
      border-left: 2px solid var(--neon-red);
      pointer-events: none;
    }

    /* Top Telemetry Header */
    .telemetry-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed rgba(255, 34, 68, 0.25);
      padding-bottom: 10px;
      margin-bottom: 24px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--neon-red);
    }

    .pulse-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 34, 68, 0.12);
      padding: 3px 8px;
      border-radius: 2px;
      border: 1px solid rgba(255, 34, 68, 0.3);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--neon-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-red);
      animation: status-blink 1.2s infinite ease-in-out;
    }

    @keyframes status-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Graphic / SVG Icon Container */
    .icon-container {
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 20px 0;
      position: relative;
    }

    .cyber-error-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Glitch Animations for SVGs */
    .fracture-bolt {
      animation: bolt-flicker 2.5s infinite steps(2, start);
    }

    .strikethrough-bar {
      animation: bar-glow 3s infinite ease-in-out;
    }

    .glitch-part-left {
      animation: glitch-jitter-left 4s infinite ease-in-out;
    }

    .glitch-part-right {
      animation: glitch-jitter-right 4s infinite ease-in-out;
    }

    .globe-right-half {
      animation: globe-displace 3.5s infinite ease-in-out;
    }

    .floating-shard {
      animation: shard-drift 3s infinite alternate ease-in-out;
    }

    .shard-1 { animation-delay: 0.2s; }
    .shard-2 { animation-delay: 0.7s; }
    .shard-3 { animation-delay: 1.2s; }
    .shard-4 { animation-delay: 0.4s; }

    @keyframes bolt-flicker {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px var(--neon-red)); }
      48% { opacity: 1; }
      50% { opacity: 0.2; }
      52% { opacity: 0.9; }
      75% { opacity: 0.4; }
      77% { opacity: 1; }
    }

    @keyframes bar-glow {
      0%, 100% { filter: drop-shadow(0 0 5px var(--neon-red)); }
      50% { filter: drop-shadow(0 0 12px var(--neon-red)); }
    }

    @keyframes glitch-jitter-left {
      0%, 92%, 100% { transform: translate(0, 0); }
      93% { transform: translate(-2px, 1px); }
      95% { transform: translate(1px, -1px); }
      97% { transform: translate(-1px, 0); }
    }

    @keyframes glitch-jitter-right {
      0%, 90%, 100% { transform: translate(0, 0); }
      91% { transform: translate(2px, -1px); }
      94% { transform: translate(-1px, 1px); }
      96% { transform: translate(1px, 0); }
    }

    @keyframes globe-displace {
      0%, 88%, 100% { transform: translate(0, 0); }
      89% { transform: translate(3px, -2px); }
      91% { transform: translate(-1px, 1px); }
      94% { transform: translate(2px, 0); }
    }

    @keyframes shard-drift {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-4px) scale(1.1); opacity: 1; }
    }

    /* Headings and Info */
    .error-headline {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--neon-red);
      text-shadow: 0 0 10px rgba(255, 34, 68, 0.6);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .error-info {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 460px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    /* Terminal Diagnostic Box */
    .diagnostic-terminal {
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 34, 68, 0.2);
      border-radius: 3px;
      padding: 12px 14px;
      font-size: 11px;
      text-align: left;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow: hidden;
    }

    .diag-row {
      display: flex;
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .diag-label {
      color: var(--neon-orange);
      font-weight: 700;
      flex-shrink: 0;
    }

    .diag-val {
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.9;
    }

    /* Action Buttons Row */
    .action-buttons {
      display: flex;
      gap: 16px;
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }

    .btn-cyber {
      position: relative;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 11px 22px;
      cursor: pointer;
      background: transparent;
      outline: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    /* Reconnect Button (Neon Orange / Red) */
    .btn-reconnect {
      color: var(--neon-orange);
      border: 1px solid var(--neon-orange);
      background: rgba(255, 136, 0, 0.08);
      box-shadow: 0 0 12px var(--neon-orange-glow);
    }

    .btn-reconnect:hover {
      background: var(--neon-orange);
      color: #050805;
      box-shadow: 0 0 24px rgba(255, 136, 0, 0.8);
      transform: translateY(-1px);
    }

    .btn-reconnect:active {
      transform: translateY(1px);
    }

    /* Dashboard Button (Neon Green) */
    .btn-dashboard {
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      background: rgba(0, 255, 102, 0.08);
      box-shadow: 0 0 12px var(--neon-green-glow);
    }

    .btn-dashboard:hover {
      background: var(--neon-green);
      color: #050805;
      box-shadow: 0 0 24px rgba(0, 255, 102, 0.8);
      transform: translateY(-1px);
    }

    .btn-dashboard:active {
      transform: translateY(1px);
    }

    /* Bottom Protocol Tag */
    .footer-tag {
      margin-top: 24px;
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--text-muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="cyber-hud-card">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>

    <!-- Header Telemetry -->
    <div class="telemetry-header">
      <span>WORLDCRAFT CORE // HUD PROTOCOL</span>
      <div class="pulse-status-badge">
        <span class="pulse-dot"></span>
        <span id="badge-status-text">OFFLINE</span>
      </div>
    </div>

    <!-- Central SVG Graphics Container -->
    <div class="icon-container">
      <!-- Fall A: Broken Wi-Fi (Offline) -->
      <svg id="icon-offline" class="cyber-error-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <defs>
          <filter id="glow-red-wifi" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="glow-orange-wifi" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Background Hex Shield Outline -->
        <polygon points="100,16 174,58 174,142 100,184 26,142 26,58" stroke="rgba(255, 34, 68, 0.25)" stroke-width="1.5" stroke-dasharray="6 4" fill="rgba(255, 34, 68, 0.03)" />

        <!-- Base Wi-Fi Dot -->
        <circle cx="100" cy="152" r="5" fill="#ff2244" filter="url(#glow-red-wifi)" />

        <!-- Wave 1 (Inner) - Split by crack -->
        <path d="M82 134 A25 25 0 0 1 96 127" stroke="#ff8800" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-orange-wifi)" />
        <path d="M104 127 A25 25 0 0 1 118 134" stroke="#ff8800" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-orange-wifi)" />

        <!-- Wave 2 (Middle) - Split by crack with slight displacement -->
        <path d="M68 116 A48 48 0 0 1 93 103" stroke="#ff8800" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-orange-wifi)" class="glitch-part-left" />
        <path d="M107 103 A48 48 0 0 1 132 116" stroke="#ff8800" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-orange-wifi)" class="glitch-part-right" />

        <!-- Wave 3 (Outer) - Split by crack -->
        <path d="M52 98 A70 70 0 0 1 90 80" stroke="#ff8800" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-orange-wifi)" class="glitch-part-left" />
        <path d="M110 80 A70 70 0 0 1 148 98" stroke="#ff8800" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-orange-wifi)" class="glitch-part-right" />

        <!-- Lightning Fracture / Crack through the signal waves -->
        <path d="M102 70 L94 92 L108 106 L95 125 L102 144" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-red-wifi)" class="fracture-bolt" />

        <!-- Diagonal Red Strike-Through Bar -->
        <line x1="42" y1="52" x2="158" y2="168" stroke="#ff2244" stroke-width="5" stroke-linecap="round" filter="url(#glow-red-wifi)" class="strikethrough-bar" />
        <line x1="42" y1="52" x2="158" y2="168" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      </svg>

      <!-- Fall B: Broken Glitched Globe (404 / Unreachable) -->
      <svg id="icon-notfound" class="cyber-error-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <defs>
          <filter id="glow-globe-orange" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="glow-globe-red" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Outer HUD Ring -->
        <circle cx="100" cy="100" r="76" stroke="rgba(255, 136, 0, 0.2)" stroke-width="1.5" stroke-dasharray="10 6" />
        <circle cx="100" cy="100" r="70" stroke="rgba(255, 34, 68, 0.3)" stroke-width="1" />

        <!-- Left Hemisphere of Wireframe Globe -->
        <g class="globe-left-half">
          <path d="M100 36 A64 64 0 0 0 100 164" stroke="#ff8800" stroke-width="2" filter="url(#glow-globe-orange)" />
          <path d="M48 78 Q80 84 96 84" stroke="rgba(255, 136, 0, 0.6)" stroke-width="1.5" />
          <path d="M37 100 Q74 104 95 104" stroke="#ff8800" stroke-width="1.5" />
          <path d="M48 122 Q80 116 97 116" stroke="rgba(255, 136, 0, 0.6)" stroke-width="1.5" />
          <path d="M100 36 C64 36 64 164 100 164" stroke="rgba(255, 136, 0, 0.45)" stroke-width="1.5" stroke-dasharray="4 2" />
        </g>

        <!-- Right Hemisphere of Wireframe Globe (Glitched & Displaced) -->
        <g class="globe-right-half">
          <path d="M100 36 A64 64 0 0 1 100 164" stroke="#ff8800" stroke-width="2" filter="url(#glow-globe-orange)" />
          <path d="M104 84 Q120 84 152 78" stroke="rgba(255, 136, 0, 0.6)" stroke-width="1.5" />
          <path d="M105 104 Q126 104 163 100" stroke="#ff8800" stroke-width="1.5" />
          <path d="M103 116 Q120 116 152 122" stroke="rgba(255, 136, 0, 0.6)" stroke-width="1.5" />
          <path d="M100 36 C136 36 136 164 100 164" stroke="rgba(255, 136, 0, 0.45)" stroke-width="1.5" stroke-dasharray="4 2" />
        </g>

        <!-- Central Jagged Glitch Fissure / Rift -->
        <path d="M98 32 L106 58 L92 84 L112 110 L94 136 L104 168" stroke="#ff2244" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-globe-red)" class="glitch-fissure" />
        <path d="M100 34 L107 58 L93 84 L113 110 L95 136 L105 166" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

        <!-- Floating / Drifting Glitch Shards -->
        <polygon points="120,68 128,72 124,78 116,74" fill="#ff2244" filter="url(#glow-globe-red)" class="floating-shard shard-1" />
        <polygon points="78,114 86,118 82,124 74,120" fill="#ff8800" filter="url(#glow-globe-orange)" class="floating-shard shard-2" />
        <polygon points="124,128 132,130 128,136 120,134" fill="#ff2244" filter="url(#glow-globe-red)" class="floating-shard shard-3" />
        <rect x="110" y="90" width="8" height="3" fill="#00ff66" opacity="0.8" class="floating-shard shard-4" />
      </svg>
    </div>

    <!-- Error Titles -->
    <h1 id="error-title" class="error-headline">SIGNAL UNTERBROCHEN // OFFLINE</h1>
    <p id="error-desc" class="error-info">Keine Verbindung zum Netzwerk gefunden.</p>

    <!-- Telemetry Diagnostic Terminal -->
    <div class="diagnostic-terminal">
      <div class="diag-row">
        <span class="diag-label">&gt; <span id="label-target">ZIEL-ADRESSE</span>:</span>
        <span id="val-target" class="diag-val">https://unknown</span>
      </div>
      <div class="diag-row">
        <span class="diag-label">&gt; <span id="label-code">FEHLERCODE</span>:</span>
        <span id="val-code" class="diag-val">ERR_CONNECTION_FAILED (-104)</span>
      </div>
      <div class="diag-row">
        <span class="diag-label">&gt; STATUS:</span>
        <span id="val-status" class="diag-val">SUBNET PACKET DROPPED // ROUTE DEAD</span>
      </div>
    </div>

    <!-- Interactive Neon Action Buttons -->
    <div class="action-buttons">
      <button id="btn-retry" class="btn-cyber btn-reconnect">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span id="text-btn-retry">[ NEU VERBINDEN ]</span>
      </button>

      <button id="btn-dashboard" class="btn-cyber btn-dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span id="text-btn-dashboard">[ DASHBOARD ]</span>
      </button>
    </div>

    <div class="footer-tag">[ WORLDCRAFT DESKTOP // ZERO-DATA-LEAK SANDBOX ]</div>
  </div>

  <script src="locales.js"></script>
  <script>
    'use strict';

    (function() {
      // 1. Parse Query Parameters
      const params = new URLSearchParams(window.location.search);
      const errType = params.get('type') || 'not_found'; // 'offline' or 'not_found'
      const errCode = params.get('code') || '-105';
      const errDesc = params.get('desc') || 'ERR_NAME_NOT_RESOLVED';
      const targetUrl = params.get('url') || '';
      const activeLang = params.get('lang') || 'de';

      // 2. Fetch i18n Dictionary
      const dict = (window.WORLDCRAFT_LOCALES && window.WORLDCRAFT_LOCALES[activeLang]) ||
                   (window.WORLDCRAFT_LOCALES && window.WORLDCRAFT_LOCALES['de']) || {};

      function t(key, fallback) {
        return dict[key] || fallback;
      }

      // 3. Bind UI Elements
      const iconOffline = document.getElementById('icon-offline');
      const iconNotFound = document.getElementById('icon-notfound');
      const badgeStatusText = document.getElementById('badge-status-text');
      const errorTitle = document.getElementById('error-title');
      const errorDesc = document.getElementById('error-desc');
      const valTarget = document.getElementById('val-target');
      const valCode = document.getElementById('val-code');
      const valStatus = document.getElementById('val-status');
      const labelTarget = document.getElementById('label-target');
      const labelCode = document.getElementById('label-code');
      const textBtnRetry = document.getElementById('text-btn-retry');
      const textBtnDashboard = document.getElementById('text-btn-dashboard');
      const btnRetry = document.getElementById('btn-retry');
      const btnDashboard = document.getElementById('btn-dashboard');

      // 4. Update Labels from Dictionary
      labelTarget.textContent = t('error_target_label', 'ZIEL-ADRESSE');
      labelCode.textContent = t('error_code_label', 'FEHLERCODE');
      textBtnRetry.textContent = t('error_btn_retry', '[ NEU VERBINDEN ]');
      textBtnDashboard.textContent = t('error_btn_dashboard', '[ DASHBOARD ]');

      valTarget.textContent = targetUrl || 'internal://unknown';
      valCode.textContent = `${errDesc} (${errCode})`;

      // 5. Select Graphics and Texts
      if (errType === 'offline') {
        iconOffline.style.display = 'block';
        iconNotFound.style.display = 'none';
        badgeStatusText.textContent = 'OFFLINE';
        errorTitle.textContent = t('error_offline_headline', 'SIGNAL UNTERBROCHEN // OFFLINE');
        errorDesc.textContent = t('error_offline_desc', 'Keine Verbindung zum Netzwerk gefunden.');
        valStatus.textContent = 'NETWORK INTERFACE DOWN // PACKET TIMEOUT';
      } else {
        iconOffline.style.display = 'none';
        iconNotFound.style.display = 'block';
        badgeStatusText.textContent = '404 // DEAD END';
        errorTitle.textContent = t('error_notfound_headline', 'ZIEL NICHT GEFUNDEN // 404');
        errorDesc.textContent = t('error_notfound_desc', 'Die angeforderte Adresse existiert nicht oder antwortet nicht.');
        valStatus.textContent = 'DNS UNRESOLVED // REMOTE HOST UNREACHABLE';
      }

      // 6. Action Button Handlers
      btnRetry.addEventListener('click', function() {
        if (targetUrl && (targetUrl.startsWith('http://') || targetUrl.startsWith('https://'))) {
          window.location.href = targetUrl;
        } else {
          window.location.reload();
        }
      });

      btnDashboard.addEventListener('click', function() {
        window.location.href = 'internal://home';
      });
    })();
  </script>
</body>
