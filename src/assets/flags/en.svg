<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <defs>
    <clipPath id="left-half">
      <rect x="0" y="0" width="30" height="40" />
    </clipPath>
    <clipPath id="right-half">
      <rect x="30" y="0" width="30" height="40" />
    </clipPath>
  </defs>

  <!-- LEFT: USA Flag (Stars & Stripes) -->
  <g clip-path="url(#left-half)">
    <!-- 13 Stripes -->
    <rect width="60" height="40" fill="#b22234"/>
    <rect y="3.08" width="60" height="3.08" fill="#ffffff"/>
    <rect y="9.23" width="60" height="3.08" fill="#ffffff"/>
    <rect y="15.38" width="60" height="3.08" fill="#ffffff"/>
    <rect y="21.54" width="60" height="3.08" fill="#ffffff"/>
    <rect y="27.69" width="60" height="3.08" fill="#ffffff"/>
    <rect y="33.85" width="60" height="3.08" fill="#ffffff"/>
    <!-- Blue Canton -->
    <rect width="25" height="21.54" fill="#3c3b6e"/>
    <!-- Cyber Stars Representation -->
    <circle cx="5" cy="4" r="1.2" fill="#ffffff"/>
    <circle cx="11" cy="4" r="1.2" fill="#ffffff"/>
    <circle cx="17" cy="4" r="1.2" fill="#ffffff"/>
    <circle cx="23" cy="4" r="1.2" fill="#ffffff"/>
    <circle cx="8" cy="8" r="1.2" fill="#ffffff"/>
    <circle cx="14" cy="8" r="1.2" fill="#ffffff"/>
    <circle cx="20" cy="8" r="1.2" fill="#ffffff"/>
    <circle cx="5" cy="12" r="1.2" fill="#ffffff"/>
    <circle cx="11" cy="12" r="1.2" fill="#ffffff"/>
    <circle cx="17" cy="12" r="1.2" fill="#ffffff"/>
    <circle cx="23" cy="12" r="1.2" fill="#ffffff"/>
    <circle cx="8" cy="16" r="1.2" fill="#ffffff"/>
    <circle cx="14" cy="16" r="1.2" fill="#ffffff"/>
    <circle cx="20" cy="16" r="1.2" fill="#ffffff"/>
  </g>

  <!-- RIGHT: UK Union Jack -->
  <g clip-path="url(#right-half)">
    <!-- Blue field -->
    <rect width="60" height="40" fill="#012169"/>
    <!-- Diagonal white cross -->
    <path d="M0,0 L60,40 M60,0 L0,40" stroke="#ffffff" stroke-width="7"/>
    <!-- Diagonal red cross -->
    <path d="M0,0 L60,40 M60,0 L0,40" stroke="#c8102e" stroke-width="4"/>
    <!-- Central white cross -->
    <path d="M30,0 V40 M0,20 H60" stroke="#ffffff" stroke-width="11"/>
    <!-- Central red cross -->
    <path d="M30,0 V40 M0,20 H60" stroke="#c8102e" stroke-width="6.5"/>
  </g>

  <!-- Subtle Cyber Divider -->
  <line x1="30" y1="0" x2="30" y2="40" stroke="#00ff66" stroke-width="1" stroke-opacity="0.8"/>
</svg>
