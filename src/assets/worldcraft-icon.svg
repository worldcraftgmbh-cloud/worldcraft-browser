<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#008f3a" />
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050805" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background base -->
  <rect width="256" height="256" rx="48" fill="#050805" />
  <rect width="252" height="252" x="2" y="2" rx="46" fill="none" stroke="#00ff66" stroke-opacity="0.25" stroke-width="2" />
  <circle cx="128" cy="128" r="96" fill="url(#core-glow)" />

  <!-- Outer Cyber Ring -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#00ff66" stroke-width="3" stroke-dasharray="8 6 24 6" opacity="0.6" />
  <circle cx="128" cy="128" r="76" fill="none" stroke="#00ff66" stroke-width="2" stroke-opacity="0.8" filter="url(#neon-glow)" />

  <!-- Hexagonal frame & Circuit lines -->
  <polygon points="128,42 202,85 202,171 128,214 54,171 54,85" fill="none" stroke="#00ff66" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="14 8" />

  <!-- Central Worldcraft W & Globe Grid -->
  <path d="M 68 128 Q 128 72 188 128 Q 128 184 68 128 Z" fill="none" stroke="#00ff66" stroke-width="2" stroke-opacity="0.7" />
  <line x1="128" y1="46" x2="128" y2="210" stroke="#00ff66" stroke-width="2" stroke-opacity="0.7" />
  
  <!-- Stylized Cyber 'W' in center -->
  <path d="M 86 100 L 102 162 L 128 122 L 154 162 L 170 100" fill="none" stroke="#00ff66" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

  <!-- Circuit nodes -->
  <circle cx="86" cy="100" r="4.5" fill="#e4ffe9" filter="url(#neon-glow)" />
  <circle cx="170" cy="100" r="4.5" fill="#e4ffe9" filter="url(#neon-glow)" />
  <circle cx="128" cy="122" r="4" fill="#00ff66" filter="url(#neon-glow)" />
  <circle cx="102" cy="162" r="3.5" fill="#00ff66" />
  <circle cx="154" cy="162" r="3.5" fill="#00ff66" />

  <circle cx="128" cy="42" r="3" fill="#00ff66" />
  <circle cx="202" cy="85" r="3" fill="#00ff66" />
  <circle cx="202" cy="171" r="3" fill="#00ff66" />
  <circle cx="128" cy="214" r="3" fill="#00ff66" />
  <circle cx="54" cy="171" r="3" fill="#00ff66" />
  <circle cx="54" cy="85" r="3" fill="#00ff66" />
</svg>
