<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e4ffe9" />
      <stop offset="50%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00e65c" />
    </linearGradient>
  </defs>

  <!-- Left Icon Section -->
  <g transform="translate(10, 10) scale(0.39)">
    <circle cx="128" cy="128" r="90" fill="none" stroke="#00ff66" stroke-width="4" stroke-dasharray="10 8" opacity="0.6" />
    <circle cx="128" cy="128" r="76" fill="none" stroke="#00ff66" stroke-width="3" stroke-opacity="0.8" filter="url(#logo-glow)" />
    <polygon points="128,42 202,85 202,171 128,214 54,171 54,85" fill="none" stroke="#00ff66" stroke-width="2.5" stroke-dasharray="14 8" />
    <path d="M 68 128 Q 128 72 188 128 Q 128 184 68 128 Z" fill="none" stroke="#00ff66" stroke-width="2.5" stroke-opacity="0.7" />
    <line x1="128" y1="46" x2="128" y2="210" stroke="#00ff66" stroke-width="2.5" stroke-opacity="0.7" />
    <path d="M 86 100 L 102 162 L 128 122 L 154 162 L 170 100" fill="none" stroke="#00ff66" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#logo-glow)" />
    <circle cx="86" cy="100" r="5" fill="#e4ffe9" filter="url(#logo-glow)" />
    <circle cx="170" cy="100" r="5" fill="#e4ffe9" filter="url(#logo-glow)" />
    <circle cx="128" cy="122" r="5" fill="#00ff66" filter="url(#logo-glow)" />
  </g>

  <!-- Typography: WORLDCRAFT -->
  <text x="130" y="65" font-family="'Consolas', 'Courier New', 'Segoe UI', monospace" font-size="44" font-weight="900" letter-spacing="8" fill="url(#text-grad)" filter="url(#logo-glow)">
    WORLDCRAFT
  </text>
  
  <!-- Subtitle: BROWSER // CYBERPUNK MATRIX EDITION -->
  <text x="134" y="94" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" letter-spacing="6" fill="#91a995">
    CYBERPUNK OS // BROWSER
  </text>

  <!-- Cyber circuit accent line -->
  <path d="M 132 104 L 380 104 L 396 114 L 560 114" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="560" cy="114" r="3" fill="#00ff66" filter="url(#logo-glow)" />
</svg>
